<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Більше число</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Гра: Більше число</h1>
       
        <div class="game-area">
            <div>
                <h3 id="userName">User</h3>
                <p>Рахунок: <span id="userScore">0</span></p>
                <div class="number" id="userNumber">-</div>
            </div>
            <div>
                <button id="generateBtn">Generate</button>
            </div>
            <div>
                <h3>Computer</h3>
                <p>Рахунок: <span id="computerScore">0</span></p>
                <div class="number" id="computerNumber">-</div>
            </div>
        </div>
        <p id="message">Гра триває до 3 перемог.</p>
        <button id="resetBtn" style="display: none;">Грати знову</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
